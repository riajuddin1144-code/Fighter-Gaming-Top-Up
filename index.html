<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fighter Gaming TopUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>༒︎🥷𝙁𝙞𝙜𝙝𝙩𝙚𝙧 𝙂𝙖𝙢𝙞𝙣𝙜 𝙏𝙤𝙥𝙐𝙥💎༒︎</h1>
  </header>

  <div class="container">

    <!-- UID -->
    <input type="text" placeholder="Enter Player UID">

    <!-- Packages -->
    <h2>💎 Diamond Packages</h2>
    <div class="packages">
      <button>100 💎 - 80 Tk</button>
      <button>310 💎 - 240 Tk</button>
      <button>520 💎 - 400 Tk</button>
      <button>1060 💎 - 800 Tk</button>
    </div>

    <!-- Payment -->
    <h2>💳 Payment</h2>
    <button class="pay" onclick="pay()">Pay with bKash</button>
    <button class="pay" onclick="pay()">Pay with Nagad</button>
    <button class="pay" onclick="pay()">💳VISA & MASTERCARD</button>



    <!-- Orders -->
    <div class="orders">
      <h3>🔥 Latest Orders</h3>
      <p>Riaj - 100 💎 ✔️</p>
      <p>Alamin - 310 💎 ✔️</p>
      <p>Saira - 520 💎 ✔️</p>
    </div>

  </div>
  
  <div class="banner">
  <img src="banner.png" class="main-banner">
  <img src="photo.png" class="profile-pic">
</div>

  <div class="orders">
  <h3>🔥 Latest Orders</h3>
  <ul id="orderList"></ul>
</div>

  <script src="script.js"></script>
</body>
</html>
