<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Fire Top-Up (Demo)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🔥 Free Fire Top-Up</h1>

    <input type="text" id="uid" placeholder="Enter Player UID">

    <select id="diamonds">
      <option value="">Select Diamonds</option>
      <option>100 Diamonds</option>
      <option>310 Diamonds</option>
      <option>520 Diamonds</option>
      <option>1060 Diamonds</option>
    </select>

    <button onclick="topup()">Top Up Now</button>

    <p id="msg"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
